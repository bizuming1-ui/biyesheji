<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Voice Clone Studio · 克隆语音系统</title>
<style>
  :root{
    --bg:#070b17; --panel:rgba(255,255,255,.055); --line:rgba(255,255,255,.09);
    --txt:#e8ecff; --mut:#8c95b8; --a1:#7c5cff; --a2:#22d3ee; --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:14px}
  body::before{content:"";position:fixed;inset:-20%;z-index:-1;
    background:radial-gradient(600px 400px at 15% 10%,rgba(124,92,255,.28),transparent 60%),
               radial-gradient(700px 500px at 90% 85%,rgba(34,211,238,.18),transparent 60%),
               radial-gradient(500px 400px at 60% 0%,rgba(244,114,182,.10),transparent 60%);}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  .app{height:100dvh;display:grid;grid-template-rows:58px 1fr;gap:10px;padding:10px}
  /* header */
  header{display:flex;align-items:center;gap:14px;padding:0 16px;border-radius:16px;background:var(--panel);
    border:1px solid var(--line);backdrop-filter:blur(14px)}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.3px;font-size:16px;white-space:nowrap}
  .logo i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-style:normal;
    background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 6px 20px rgba(124,92,255,.45)}
  .sp{flex:1}
  .chip{display:flex;align-items:center;gap:8px;padding:6px 11px;border-radius:12px;background:rgba(255,255,255,.05);
    border:1px solid var(--line);font-size:12px;color:var(--mut);white-space:nowrap}
  .chip b{color:var(--txt);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)} .dot.load{background:var(--warn);animation:blink 1s infinite}
  .dot.err{background:var(--bad)}
  @keyframes blink{50%{opacity:.25}}
  .gbar{width:46px;height:6px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
  .gbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--a1),var(--a2));width:0;transition:width .5s}
  /* layout */
  main{min-height:0;display:grid;grid-template-columns:380px minmax(0,1fr);gap:10px}
  .card{min-height:0;display:flex;flex-direction:column;border-radius:18px;background:var(--panel);border:1px solid var(--line);
    backdrop-filter:blur(14px);padding:14px;gap:10px;overflow:hidden}
  .card h2{font-size:13px;font-weight:600;letter-spacing:.4px;display:flex;align-items:center;gap:8px;color:#cfd6ff}
  .card h2 em{font-style:normal;font-size:11px;color:var(--mut);font-weight:400;margin-left:auto}
  .num{width:20px;height:20px;border-radius:7px;display:grid;place-items:center;font-size:11px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
  .btn{padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);transition:.15s;font-weight:500;white-space:nowrap}
  .btn:hover{background:rgba(255,255,255,.12);transform:translateY(-1px)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn.pri{background:linear-gradient(135deg,var(--a1),#5b8cff 55%,var(--a2));border:0;color:#fff;box-shadow:0 8px 24px rgba(91,140,255,.35)}
  .btn.pri:hover{filter:brightness(1.1)}
  .btn.danger{background:rgba(251,113,133,.16);border-color:rgba(251,113,133,.4);color:#ffd1d8}
  /* left: clone */
  .script{padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px dashed rgba(255,255,255,.14);
    font-size:12.5px;line-height:1.65;color:#cdd3f5;position:relative}
  .script small{display:block;color:var(--mut);margin-bottom:4px;font-size:11px;padding-right:48px}
  .script button{position:absolute;right:8px;top:6px;font-size:11px;color:var(--a2)}
  .recrow{display:flex;align-items:center;gap:12px}
  .rec{width:62px;height:62px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:24px;
    background:radial-gradient(circle at 30% 30%,#ff7a8c,#e11d48);box-shadow:0 8px 26px rgba(225,29,72,.45);transition:.2s}
  .rec.on{animation:pulse 1.1s infinite;background:radial-gradient(circle at 30% 30%,#fff,#fb7185)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(251,113,133,.65)}100%{box-shadow:0 0 0 22px rgba(251,113,133,0)}}
  canvas.wave{flex:1;height:62px;border-radius:12px;background:rgba(0,0,0,.28);width:100%}
  .row{display:flex;gap:8px;align-items:center}
  .row .btn{flex:1}
  textarea.t,input.t{width:100%;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);color:var(--txt);
    padding:9px 12px;font:inherit;outline:none;resize:none}
  textarea.t:focus,input.t:focus{border-color:rgba(124,92,255,.7)}
  audio{width:100%;height:32px}
  .prog{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
  .prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .4s}
  .gpuline{display:grid;grid-template-columns:48px 1fr;gap:4px 8px;align-items:center;font-size:11.5px;color:var(--mut)}
  .gpuline span.m{grid-column:1/3;margin-top:-2px;color:#b9c1ea}
  .result{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25)}
  .ring{--p:0;width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;
    background:conic-gradient(var(--ok) calc(var(--p)*1%),rgba(255,255,255,.1) 0)}
  .ring span{width:46px;height:46px;border-radius:50%;background:#0d1328;display:grid;place-items:center}
  .warns{font-size:11.5px;color:var(--warn);line-height:1.5}
  /* center: chat */
  #msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px 4px;scroll-behavior:smooth}
  #msgs::-webkit-scrollbar{width:0}
  .msg{max-width:84%;padding:10px 14px;border-radius:16px;line-height:1.7;white-space:pre-wrap;word-break:break-word;font-size:14.5px;animation:in .25s}
  @keyframes in{from{opacity:0;transform:translateY(6px)}}
  .msg.u{align-self:flex-end;background:linear-gradient(135deg,rgba(124,92,255,.85),rgba(91,140,255,.8));border-bottom-right-radius:5px}
  .msg.a{align-self:flex-start;background:rgba(255,255,255,.07);border:1px solid var(--line);border-bottom-left-radius:5px}
  .msg.e{align-self:center;font-size:12.5px;color:#ffd1d8;background:rgba(251,113,133,.14);border:1px solid rgba(251,113,133,.4);max-width:92%}
  .msg.s{align-self:center;font-size:12px;color:var(--mut);background:none;padding:2px}
  .msg.a.live::after{content:"▍";color:var(--a2);animation:blink 1s infinite}
  .empty{margin:auto;text-align:center;color:var(--mut);line-height:2}
  .empty b{display:block;font-size:20px;color:var(--txt);margin-bottom:4px}
  .bar{display:flex;gap:8px;align-items:center}
  .iconbtn{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:19px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
  .iconbtn.on{background:rgba(251,113,133,.25);border-color:var(--bad);animation:pulse 1.1s infinite}
  #errbar{display:none;margin:0 0 8px;padding:8px 12px;border-radius:12px;background:rgba(251,113,133,.14);border:1px solid rgba(251,113,133,.5);color:#ffd3da;font-size:12px;line-height:1.6;align-items:center;gap:10px}
  #errbar.show{display:flex}
  #errbar span{flex:1;word-break:break-all}
  .opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mut)}
  .tg{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer;user-select:none}
  .tg.on{color:#fff;background:rgba(124,92,255,.28);border-color:rgba(124,92,255,.7)}
  input[type=range]{accent-color:var(--a1);width:70px}
  #viz{height:26px;width:90px;border-radius:8px;background:rgba(0,0,0,.25)}
  .state{display:flex;align-items:center;gap:8px;margin-left:auto}
  #chips{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;flex:1;min-height:0;overflow:hidden}
  .ch{padding:4px 10px;border-radius:999px;font-size:12px;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.35);color:#c9f6ff}
  .ch i{font-style:normal;color:var(--mut);margin-left:4px}
  .tabs{display:none}
  /* overlay */
  #gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,8,20,.82);backdrop-filter:blur(10px)}
  #gate .box{text-align:center;max-width:420px;padding:30px}
  .orb{width:110px;height:110px;border-radius:50%;margin:0 auto 22px;background:radial-gradient(circle at 30% 30%,#fff,var(--a1) 40%,var(--a2));
    box-shadow:0 0 60px rgba(124,92,255,.7);animation:float 3s ease-in-out infinite}
  @keyframes float{50%{transform:translateY(-8px) scale(1.04)}}
  #gate h1{font-size:24px;margin-bottom:8px} #gate p{color:var(--mut);line-height:1.8;margin-bottom:22px}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;padding:10px 18px;border-radius:12px;background:#1a2142;
    border:1px solid var(--line);opacity:0;pointer-events:none;transition:.3s;max-width:80vw}
  #toast.show{opacity:1}
  /* narrow screens: tabs, still no scrolling */
  @media (max-width:1080px){
    main{grid-template-columns:1fr;grid-template-rows:1fr 48px}
    .tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;order:2}
    .tabs button{border-radius:14px;background:var(--panel);border:1px solid var(--line)}
    .tabs button.on{background:linear-gradient(135deg,var(--a1),var(--a2));border:0}
    main>.card{display:none;order:1} main[data-tab="clone"]>#c-clone,main[data-tab="chat"]>#c-chat,
    .hide-n{display:none}
  }

  /* 运行日志 */
  .logbtn{cursor:pointer;color:#cfd6ff;border-color:rgba(124,92,255,.55);background:rgba(124,92,255,.16)}
  .logbtn:hover{background:rgba(124,92,255,.32)}
  #logmodal{position:fixed;inset:0;z-index:99;display:none;background:rgba(3,6,14,.78);backdrop-filter:blur(6px);padding:3vh 3vw}
  #logmodal.show{display:block}
  #logmodal .lbox{height:100%;display:flex;flex-direction:column;border-radius:16px;background:#0d1224;border:1px solid var(--line);overflow:hidden}
  #logmodal .lhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  #logmodal .lhead b{font-size:15px;margin-right:auto}
  #logmodal .lbtn{padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:12px}
  #logmodal .lbtn:hover{background:rgba(255,255,255,.14)}
  #logmodal .lbody{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  #logmodal .an{display:grid;gap:6px}
  #logmodal .ai{padding:8px 11px;border-radius:10px;border-left:4px solid var(--mut);background:rgba(255,255,255,.04);font-size:13px;line-height:1.55}
  #logmodal .ai.bad{border-color:var(--bad)} #logmodal .ai.warn{border-color:var(--warn)} #logmodal .ai.ok{border-color:var(--ok)} #logmodal .ai.info{border-color:var(--a2)}
  #logmodal .ai small{display:block;color:var(--mut)}
  #logmodal pre{white-space:pre-wrap;word-break:break-all;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#c9d1f5;background:#070b17;border:1px solid var(--line);border-radius:10px;padding:12px;user-select:text}
</style>
<script>
/* ===== 检测探针 v1 =====
   记录所有 /api 请求(耗时/状态码/失败)、按钮点击、JS 错误、音频/麦克风状态;
   ① 每 4 秒批量上报服务端 /api/clientlog(出现在 /api/diag 与检测日志里)
   ② 同时 postMessage 给「浏览器模拟器」(右上角检测日志面板实时显示) */
(function () {
  var RING = [], Q = [], MAX = 300, of = window.fetch.bind(window), ST = {};
  function emit(e) {
    e.t = Date.now(); RING.push(e); if (RING.length > MAX) RING.shift(); Q.push(e); if (Q.length > 200) Q.shift();
    try { if (window.parent !== window) window.parent.postMessage({ vc: 1, entry: e }, "*"); } catch (_) {}
  }
  window.__VC_LOG = RING; window.__vcEmit = emit;
  function cls(url) { var m = /\/api\/([a-z/]+)/.exec(url); return m ? m[1] : "other"; }
  window.fetch = function (u, o) {
    var url = typeof u === "string" ? u : (u && u.url) || "", m = (o && o.method) || "GET", t0 = performance.now();
    if (/\/api\/clientlog/.test(url)) return of(u, o);
    var k = cls(url), s = ST[k] = ST[k] || { n: 0, fail: 0, sum: 0, max: 0 };
    return of(u, o).then(function (r) {
      var ms = Math.round(performance.now() - t0); s.n++; s.sum += ms; if (ms > s.max) s.max = ms;
      var routine = /^(ping|status|events|voice\/job|voice\/chunk|voice\/chunk_status|diag|perf)$/.test(k);
      if (!r.ok || !routine) emit({ kind: "http", method: m, url: url.replace(/sid=[^&]+/, "sid=*").slice(0, 120), status: r.status, ms: ms });
      return r;
    }, function (err) {
      s.n++; s.fail++;
      emit({ kind: "http-fail", method: m, url: url.replace(/sid=[^&]+/, "sid=*").slice(0, 120), ms: Math.round(performance.now() - t0), msg: String((err && err.message) || err) });
      throw err;
    });
  };
  window.addEventListener("error", function (e) { emit({ kind: "js-error", msg: (e.message || "") + " @" + (e.filename || "").split("/").pop() + ":" + (e.lineno || 0) }); });
  window.addEventListener("unhandledrejection", function (e) { emit({ kind: "js-error", msg: "Promise: " + String((e.reason && e.reason.message) || e.reason) }); });
  document.addEventListener("click", function (e) {
    var b = e.target && e.target.closest && e.target.closest("button,[id]");
    if (b && b.id) emit({ kind: "ui", msg: "点击 #" + b.id + (b.disabled ? " (按钮被禁用,未生效)" : "") });
  }, true);
  document.addEventListener("visibilitychange", function () { emit({ kind: "ui", msg: "页面 " + document.visibilityState }); });
  window.addEventListener("online", function () { emit({ kind: "net", msg: "浏览器恢复联网" }); });
  window.addEventListener("offline", function () { emit({ kind: "net", msg: "浏览器断网" }); });
  setInterval(function () {
    var o = {}; for (var k in ST) { var s = ST[k]; o[k] = { n: s.n, fail: s.fail, avg: s.n ? Math.round(s.sum / s.n) : 0, max: s.max }; }
    var ac = window.player && window.player.ctx;
    emit({ kind: "stats", extra: JSON.stringify({ http: o, audio: ac ? { state: ac.state, sr: ac.sampleRate, underruns: window.player.underruns, hold: window.player.hold } : null }) });
  }, 10000);
  setInterval(function () {
    if (!Q.length) return; var b = Q.splice(0, Q.length);
    of("/api/clientlog", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b), keepalive: true }).catch(function () {});
  }, 4000);
  window.addEventListener("message", function (e) {
    if (e.data && e.data.vcPing) { try { window.parent.postMessage({ vc: 1, backlog: RING.slice(-120) }, "*"); } catch (_) {} }
  });
  emit({ kind: "env", msg: "页面载入", extra: JSON.stringify({ ua: navigator.userAgent, secure: window.isSecureContext, mic: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia), rec: typeof MediaRecorder !== "undefined", ac: typeof (window.AudioContext || window.webkitAudioContext) !== "undefined", framed: window.parent !== window }) });
})();
</script>
</head>
<body>
<div id="gate"><div class="box">
  <div class="orb"></div><h1>Voice Clone Studio</h1>
  <p>双卡 Qwen3-TTS 声音克隆 · 实时对话<br/>点击下方按钮启用声音(浏览器要求一次用户手势才能自动播放)。</p>
  <button class="btn pri" id="enter" style="padding:13px 34px;font-size:16px">进入系统</button>
</div></div>

<div class="app">
  <header>
    <div class="logo"><i>🎙</i>Voice Clone Studio</div>
    <button class="chip logbtn" id="logbtn" title="运行日志:全面检测哪一部分慢、哪一部分还能提升">📋 运行日志</button>
    <div class="sp"></div>
    <div class="chip hide-n"><span class="dot" id="d-conn"></span>连接 <b id="t-conn">…</b></div>
    <div class="chip hide-n"><span class="dot" id="d-llm"></span>对话 <b id="t-llm">…</b></div>
    <div class="chip hide-n"><span class="dot" id="d-tts"></span>语音 <b id="t-tts">…</b></div>
    <div class="chip" id="g0"><b>GPU0</b><div class="gbar"><i></i></div><span>—</span></div>
    <div class="chip" id="g1"><b>GPU1</b><div class="gbar"><i></i></div><span>—</span></div>
    <div class="chip"><span>首声</span><b id="ttfa">—</b></div>
    <div class="chip hide-n"><span>声音</span><b id="vstate">未训练</b></div>
  </header>

  <div id="errbar"><span id="errtxt"></span><button class="btn pri" id="reload" style="padding:6px 14px">🔄 重新加载模型</button></div>
  <main data-tab="chat" id="main">
    <!-- ① 克隆 -->
    <section class="card" id="c-clone">
      <h2><span class="num">1</span>录制 / 上传参考语音<em id="rectime">00:00</em></h2>
      <div class="script"><small>请用自然的语气朗读(包含停顿、呼吸与情绪,8~20 秒最佳)</small><span id="scriptText"></span><button id="nextScript">换一段</button></div>
      <div class="recrow"><button class="rec" id="rec" title="开始/停止录音">🎤</button><canvas class="wave" id="wave"></canvas></div>
      <div class="row"><button class="btn" id="upload">⬆ 上传音频</button><button class="btn" id="clear">清除</button></div>
      <input type="file" id="file" accept="audio/*,video/*" hidden />
      <audio id="preview" controls style="display:none"></audio>
      <textarea class="t" id="reftext" rows="2" placeholder="参考文本(留空 = 自动识别,推荐)"></textarea>
      <button class="btn pri" id="train" style="padding:12px;font-size:15px" disabled>🚀 开始训练(双卡同时)</button>
      <div class="prog"><i id="pall"></i></div>
      <div class="gpuline" id="gl"></div>
      <div class="result" id="result" style="display:none"><div class="ring" id="ring"><span id="ringv">—</span></div>
        <div style="font-size:12px;line-height:1.6"><b id="rmode">—</b><br/><span style="color:var(--mut)" id="rinfo"></span></div></div>
      <div class="warns" id="warns"></div>
    </section>

    <!-- ② 对话 -->
    <section class="card" id="c-chat">
      <h2><span class="num">2</span>语音对话 · 克隆声音自动朗读<div class="state"><canvas id="viz" width="180" height="52"></canvas><span id="pstate" style="font-size:12px;color:var(--mut)">待机</span></div></h2>
      <div id="msgs"><div class="empty"><b>先训练声音,再开始聊天</b>打字 · 或点 🎤 直接说话<br/>AI 的回答会用你的克隆声音立即朗读</div></div>
      <div class="opts">
        <label class="tg on" id="tgAuto">🔊 自动播放</label>
        <label class="tg on" id="tgSmooth" title="播放中途若合成跟不上,先攒够缓冲再继续,避免卡顿">🧵 无停顿优先</label>
        <label class="tg on" id="tgFiller" title="用你的克隆声音先说「嗯,」「好的,」,0 延迟出声,正文同时在双卡合成">💬 语气词先行</label>
        <label class="tg" id="tgLong">📖 长文模式</label>
        <label class="tg hide-n">🌬 呼吸 <input type="range" id="breath" min="0" max="100" value="40" /></label>
        <button class="tg" id="reset">🧹 新对话</button>
      </div>
      <div class="bar">
        <button class="iconbtn" id="mic" title="语音输入">🎙</button>
        <input class="t" id="input" placeholder="输入消息,回车发送 …" autocomplete="off" />
        <button class="btn pri" id="send" style="height:44px">发送</button>
        <button class="btn danger" id="stop" style="height:44px">停止</button>
      </div>
    </section>

    <nav class="tabs"><button data-t="clone">🎤 克隆</button><button data-t="chat" class="on">💬 对话</button></nav>
  </main>
</div>

/* ---------------- 无缝播放器 ---------------- */
class GaplessPlayer {
  constructor() { this.ctx = null; this.hold = 0; this.floor = 1.2; this.reset(); this.onstate = () => {}; this.onfirst = () => {}; }
  ensure() {

  reset() { this.turn = -1; this.pending = new Map(); this.expect = 0; this.total = null; this.nextTime = 0; this.srcs = new Set(); this.waitSince = 0; this.underruns = 0; this.firstDone = false; clearTimeout(this.timer); }

  finish(total) { this.total = total; this.drain(); this.check(); }
  push(turn, idx, sr, f32) { if (turn !== this.turn) return; this.pending.set(idx, { sr, f32 }); this.drain(); }
  readyDur() { let d = 0, i = this.expect; while (this.pending.has(i)) { const c = this.pending.get(i); d += c.f32.length / c.sr; i++; } return d; }
  drain() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const lead = this.nextTime - now;
    const idle = this.srcs.size === 0 || lead < 0.01;
    if (idle && this.pending.has(this.expect)) {
      const isRe = this.expect > 0;                       // 播放中途断流 → 重新缓冲
      const need = isRe ? Math.max(this.hold, this.floor) : (this.fillerFirst || !this.floor ? 0 : 0.6);                  // 首句立即播,中途缺料则多攒一点
      const all = this.total !== null && this.expect + this.pending.size >= this.total;
      if (!this.waitSince) this.waitSince = performance.now();
      const waited = (performance.now() - this.waitSince) / 1000;
      if (this.readyDur() < need && !all && waited < 3) { this.onstate("buffering"); clearTimeout(this.timer); this.timer = setTimeout(() => this.drain(), 120); return; }
      if (isRe && this.srcs.size === 0 && lead < 0) { this.underruns++; this.hold = Math.min(4, this.hold + 0.7); }
      this.waitSince = 0;
      this.nextTime = Math.max(now + 0.03, this.nextTime);
    }
    while (this.pending.has(this.expect)) { const c = this.pending.get(this.expect); this.pending.delete(this.expect); this.expect++; this.sched(c); }
  }
  sched(c) {
    const buf = this.ctx.createBuffer(1, c.f32.length, c.sr); buf.copyToChannel(c.f32, 0);
    const src = this.ctx.createBufferSource(); src.buffer = buf; src.connect(this.gain);
    const at = Math.max(this.nextTime, this.ctx.currentTime + 0.02);
    src.start(at); this.nextTime = at + buf.duration; this.srcs.add(src);
    src.onended = () => { this.srcs.delete(src); this.check(); };
    this.onstate("playing");
    if (!this.firstDone) { this.firstDone = true; this.onfirst(performance.now(), at - this.ctx.currentTime); }
  }
  check() {
    if (this.total !== null && this.expect >= this.total && this.srcs.size === 0) { this.onstate("idle"); if (this.underruns === 0) this.hold = Math.max(0, this.hold - 0.15); }
  }
}

function pickMime() { const c = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"]; return c.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || ""; }

  catch (e) { toast("无法访问麦克风:请允许权限(需要 HTTPS 页面)", 5000); return; }

/* ---------------- 训练 ---------------- */
/* ---------------- 参考音频压缩 + 分块上传(v6) ----------------
   根因:几 MB 的整段上传经公网隧道经常卡住/被掐断(界面停在「正在上传参考音频」且连接显示重连中)。
   做法:① 浏览器端先解码→单声道→24kHz→最多 30 秒→16bit WAV(70 秒录音 4.6MB → 约 1.4MB,服务端本来也只用前 20 秒);
        ② 切成 192KB 小块并行上传,每块独立超时/重试,已到达的块不重传(断点续传);
        ③ 全部到齐后再发一个很小的「开始训练」请求(幂等)。 */
function wavBlob(f32, sr) {
  const n = f32.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0, o = 44; i < n; i++, o += 2) { const x = Math.max(-1, Math.min(1, f32[i])); v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true); }
  return new Blob([buf], { type: "audio/wav" });
}
async function prepareRef(blob) {
  const t0 = performance.now(), res = { blob: blob, name: "ref.webm", src_kb: Math.round(blob.size / 1024), mode: "raw", ms: 0 };
  try {
    const AC = window.AudioContext || window.webkitAudioContext, SR = 24000, MAXS = 30;
    const ab = await blob.arrayBuffer(), ac = new AC();

    try { buf = await Promise.race([ac.decodeAudioData(ab), sleep(20000).then(() => { throw new Error("解码超时"); })]); } finally { try { ac.close(); } catch (_) {} }
    const n = Math.min(buf.length, Math.floor(MAXS * buf.sampleRate)), ch = buf.numberOfChannels, mono = new Float32Array(n);
    for (let c = 0; c < ch; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) mono[i] += d[i] / ch; }
    let pcm = mono;

  } catch (e) { res.err = String((e && e.message) || e); }  // 解码失败:原文件照样分块上传,服务端用 ffmpeg 解码
  res.ms = Math.round(performance.now() - t0); res.kb = Math.round(res.blob.size / 1024);

}
function makeUid() { return (window.crypto && crypto.randomUUID ? crypto.randomUUID().replace(/-/g, "") : Math.random().toString(36).slice(2) + Date.now().toString(36)).slice(0, 32); }
async function uploadChunks(prep, onProg) {
  const blob = prep.blob, CH = 192 * 1024, total = Math.max(1, Math.ceil(blob.size / CH));
  prep.uid = prep.uid || makeUid();

  try { const r = await jfetch("/api/voice/chunk_status?uid=" + uid, {}, 6000); if (r.ok) { const j = await r.json(); if (j.total === total) (j.got || []).forEach((i) => have.add(i)); } } catch (_) {}
  const todo = []; for (let i = 0; i < total; i++) if (!have.has(i)) todo.push(i);
  async function sendOne(i) {
    const part = blob.slice(i * CH, Math.min(blob.size, (i + 1) * CH)); let d = 500;
    for (let a = 0; a < 8; a++) {
      try {
        const r = await jfetch("/api/voice/chunk?uid=" + uid + "&idx=" + i + "&total=" + total, { method: "POST", headers: { "Content-Type": "application/octet-stream" }, body: part }, 25000);
        if (r.ok) { setConn(true); have.add(i); st.sent += part.size; onProg(have.size / total, st.sent / 1024 / Math.max(0.2, (performance.now() - t0) / 1000), st.retries, total); return; }

let refPrep = null, refPrepFor = null;
$("train").onclick = async () => {
  if (!refBlob) return;
  const text = $("reftext").value, lang = scriptIdx % SCRIPTS.length === 2 ? "en" : "zh", emit = window.__vcEmit || function () {};
  $("train").disabled = true; $("result").style.display = "none"; $("warns").textContent = "";
  const say = (h, w) => { if (w != null) $("pall").style.width = w + "%"; $("gl").innerHTML = '<span class="m" style="color:#cfd6ff">' + h + "</span>"; };
  const fail = (m) => { toast(m, 6000); say("❌ " + m + " · 可再次点击『开始训练』(已上传的分块不会重传)"); $("train").disabled = false; };
  say("已点击开始训练 · 正在压缩参考音频(" + (refBlob.size / 1024).toFixed(0) + " KB)…", 2);
  emit({ kind: "train", msg: "开始训练 原始 " + refBlob.size + " 字节" });

    up = await uploadChunks(prep, (f, kbps, rt, total) => say("正在上传参考音频 " + Math.round(f * 100) + "% · " + kbps.toFixed(0) + " KB/s · " + prep.kb + " KB" + (rt ? " · 已自动重试 " + rt + " 次" : ""), 2 + Math.round(f * 10)));

    const fd = new FormData(); fd.append("file", prep.blob, prep.name); fd.append("text", text); fd.append("lang", lang);
    for (let i = 0; i < 4 && !r; i++) { try { r = await jfetch("/api/voice/train", { method: "POST", body: fd }, 90000); } catch (e) { await sleep(800 * (i + 1)); } }
  } else {
    for (let round = 0; round < 3 && !(r && r.ok); round++) {
      for (let i = 0; i < 6; i++) {
        try {
          r = await jfetch("/api/voice/train_uploaded", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ uid: up.uid, total: up.total, text: text, lang: lang }) }, 20000);
          break;
        } catch (e) { r = null; await sleep(600 * (i + 1)); }
      }
      if (r && r.status === 422) { try { await uploadChunks(prep, () => {}); } catch (e) { last = e.message; } continue; }  // 个别块丢失:补传后重试

    }

  if (!r.ok) { const j = await r.json().catch(() => ({})); return fail("启动训练失败: " + (typeof j.detail === "string" ? j.detail : r.status)); }

function startJobPoll() { clearInterval(jobTimer); jobTimer = setInterval(pollJob, 800); pollJob(); }

    $("pall").style.width = (j.progress || 0) + "%";
    $("gl").innerHTML = (j.gpus || []).map((g) => `<b style="color:#cfd6ff">GPU${g.gpu}</b><div class="prog"><i style="width:${g.progress}%"></i></div><span class="m">${g.msg}</span>`).join("")
      + `<span class="m" style="color:#cfd6ff">${j.stage || ""}</span>`
      + (j.state === "error" ? `<span class="m" style="color:#ff8a8a;white-space:pre-wrap">❌ ${String(j.error || "").replace(/</g, "&lt;")}\n${(j.log || []).slice(-6).join("\n").replace(/</g, "&lt;")}</span>` : "")
      + (j.state === "running" && j.started ? `<span class="m">阶段日志:${(j.log || []).slice(-2).join(" | ").replace(/</g, "&lt;")}</span>` : "");

    $("ttfa").title = "服务端首声 " + m.stats.ttfa_ms + "ms · LLM首字 " + m.stats.llm_first_ms + "ms · " + gs;

async function doChat(text, speak) {
  const my = ++runId;
  const bubble = curBubble = addMsg("a live", ""); tSend = performance.now();
  let tid;
  try { tid = (await postRetry("/api/chat", { sid: SID, text, speak: !!speak, opts: { long: longMode, breath: $("breath").value / 100, filler: fillerOn } })).tid; }
  catch (e) { if (my === runId) { endBubble(); addMsg("e", "⚠ 发送失败:" + e.message); } return; }
  let after = 0, fails = 0, lastAct = performance.now();
  while (my === runId) {
    let j;
    try {
      const r = await jfetch(`/api/events?sid=${encodeURIComponent(SID)}&tid=${tid}&after=${after}&wait=12`, {}, 26000);
      if (!r.ok) throw new Error("HTTP " + r.status);
      j = await r.json(); fails = 0; setConn(true);
    } catch (e) {
      fails++; setConn(false);
      if (fails > 60) { if (my === runId) { endBubble(); addMsg("e", "⚠ 与服务器断开超过 1 分钟,请检查 Kaggle 单元格是否仍在运行,然后重新发送。"); } return; }
      await sleep(Math.min(2000, 250 * fails)); continue;
    }
    if (my !== runId) return;
    if (j.superseded) break;
    for (const m of j.events) { try { handleEvent(m, bubble); } catch (e) { console.error(e); } }
    after = j.next;
    if (j.events.length) lastAct = performance.now();
    if (j.done) break;
    if (performance.now() - lastAct > 150000) { addMsg("e", "⚠ 服务端 150 秒没有任何输出。请点「停止」后重试,并查看 Kaggle 输出框里的 [turn]/[llm] 日志。"); break; }
  }
  if (my === runId) endBubble();
}

let micRec = null, micStream = null, micAC = null, micRAF = 0;

  function fname(ext) { const t = new Date(), z = (n) => String(n).padStart(2, "0"); return "run-log-" + t.getFullYear() + z(t.getMonth() + 1) + z(t.getDate()) + "-" + z(t.getHours()) + z(t.getMinutes()) + z(t.getSeconds()) + "." + ext; }
  function dl(name, text, mime) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
  async function copy(text) { try { await navigator.clipboard.writeText(text); return true; } catch (_) { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.remove(); return ok; } }
  function open_() { $("logmodal").classList.add("show"); $("logpre").textContent = "加载中…"; refresh(); clearInterval(timer); timer = setInterval(() => { if ($("logauto").checked) refresh(); }, 3000); }
  function close_() { $("logmodal").classList.remove("show"); clearInterval(timer); }
  $("logbtn").onclick = open_; $("logclose").onclick = close_; $("logrefresh").onclick = refresh;
  $("logmodal").addEventListener("click", (e) => { if (e.target === $("logmodal")) close_(); });
  $("logcopy").onclick = async () => toast((await copy(LASTTXT)) ? "已复制运行日志(" + LASTTXT.length + " 字符)" : "复制失败,请手动选中文本", 3000);
  $("logtxt").onclick = () => dl(fname("txt"), LASTTXT, "text/plain;charset=utf-8");
  $("logjson").onclick = () => dl(fname("json"), JSON.stringify(LAST, null, 2), "application/json");
  $("loggh").onclick = async () => {
    const name = fname("txt"), ok = await copy(LASTTXT);
    toast(ok ? "已复制日志,正在打开 GitHub:在编辑框里粘贴后提交" : "请先手动复制日志,再到 GitHub 粘贴", 5000);
    window.open("https://github.com/" + REPO + "/new/main?filename=" + encodeURIComponent("logs/" + name), "_blank", "noopener");
  };
  window.__vcOpenLog = open_;
})();
</script>
</body>
</html>
